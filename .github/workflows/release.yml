name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: choco install ffmpeg --yes --no-progress
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked

  release:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package (exe + ytmeta.py + README + scripts)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/larp-music-player.exe dist/
          Copy-Item ytmeta.py dist/
          Copy-Item README.md dist/
          Copy-Item scripts dist/scripts -Recurse
          Compress-Archive -Path dist/* -DestinationPath larp-music-player-windows-x86_64.zip -Force
          $hash = (Get-FileHash larp-music-player-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  larp-music-player-windows-x86_64.zip" | Set-Content -Encoding ascii larp-music-player-windows-x86_64.zip.sha256
          Get-Content larp-music-player-windows-x86_64.zip.sha256
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            larp-music-player-windows-x86_64.zip
            larp-music-player-windows-x86_64.zip.sha256
          generate_release_notes: true
